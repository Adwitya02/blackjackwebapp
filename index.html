<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="welcome-screen" class="screen">
        <h1>Welcome to Blackjack!</h1>
        <form id="welcome-form">
            <label for="player-name">Enter your name:</label>
            <input type="text" id="player-name" required>
            <button type="submit">Start Game</button>
            <button type="button" onclick="loadMyGames()">My Saved Games</button>
        </form>
    </div>
    <div id="game-screen" class="screen hidden">
        <header class="scoreboard">
            <div>Wins: <span id="wins">0</span></div>
            <div>Losses: <span id="losses">0</span></div>
            <div>Draws: <span id="draws">0</span></div>
            <div>Player: <span id="player-name-display"></span></div>
        </header>

        <main>
            <section class="dealer-area">
                <h2>Dealer: <span id="dealer-sum">0</span></h2>
                <div id="dealer-cards" class="cards-container"></div>
            </section>

            <section class="player-area">
                <h2>Player: <span id="player-sum">0</span></h2>
                <div id="player-cards" class="cards-container"></div>
            </section>

            <div id="game-message" class="game-message"></div>

            <div class="controls">
                <button id="deal">Deal</button>
                <button id="hit">Hit</button>
                <button id="stand">Stand</button>
                <button id="back-to-welcome">Change Name</button>
            </div>
        </main>
    </div>
    <script type="module" src="js/firebaseConfig.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/save.js"></script>
    <script type="module" src="js/game-logic.js"></script>
    <script type="module" src="js/dom-updates.js"></script>
    <script type="module" src="js/event-listeners.js"></script>
    <script type="module" src="js/welcome.js"></script>
</body>
</html>
